<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Recuperar Contraseña - DCEP</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#bfff00",
                        "background-dark": "#050505",
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Lexend', sans-serif; background-color: #050505; }
        .neon-border {
            border: 1px solid rgba(191, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(191, 255, 0, 0.05);
        }
    </style>
    <link rel="stylesheet" href="assets/cursor.css"/>
    <script src="assets/cursor.js" defer></script>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen flex flex-col items-center justify-center px-6 font-display">

    <div class="w-full max-w-sm">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-black text-primary tracking-tighter italic">DCEP</h1>
            <p id="subtitle" class="text-[10px] uppercase tracking-[0.4em] font-bold text-slate-500 mt-2">Recuperar Contraseña</p>
        </div>

        <div class="bg-white/5 backdrop-blur-xl rounded-3xl p-8 neon-border">
            <!-- Paso 1: pedir el link por email -->
            <form id="request-form" class="space-y-4">
                <p class="text-slate-400 text-xs leading-relaxed">Ingresá tu email y te enviamos un link para crear una contraseña nueva.</p>
                <div>
                    <label class="text-[10px] uppercase font-black text-slate-500 ml-1 mb-2 block">Email</label>
                    <input type="email" id="email" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 focus:border-primary/50 text-white outline-none transition-all" placeholder="ejemplo@email.com">
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-[#d4ff00] text-black font-black py-4 rounded-xl mt-4 shadow-lg transition-all active:scale-95 uppercase tracking-widest text-xs disabled:opacity-50">
                    Enviar link
                </button>
            </form>

            <!-- Paso 2: definir la nueva contraseña (se llega desde el link del email) -->
            <form id="update-form" class="space-y-4 hidden">
                <div>
                    <label class="text-[10px] uppercase font-black text-slate-500 ml-1 mb-2 block">Nueva contraseña</label>
                    <input type="password" id="new-password" required minlength="6" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 focus:border-primary/50 text-white outline-none transition-all" placeholder="••••••••">
                </div>
                <div>
                    <label class="text-[10px] uppercase font-black text-slate-500 ml-1 mb-2 block">Repetir contraseña</label>
                    <input type="password" id="confirm-password" required minlength="6" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 focus:border-primary/50 text-white outline-none transition-all" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-[#d4ff00] text-black font-black py-4 rounded-xl mt-4 shadow-lg transition-all active:scale-95 uppercase tracking-widest text-xs disabled:opacity-50">
                    Guardar contraseña
                </button>
            </form>

            <p id="msg" class="text-[10px] text-center mt-4 hidden"></p>

            <div class="mt-6 text-center">
                <a href="login.html" class="text-slate-500 text-[10px] uppercase font-bold hover:text-primary transition-colors">Volver al login</a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://nfmbklhhrrnrakndkcch.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mbWJrbGhocnJucmFrbmRrY2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1ODQ3NjUsImV4cCI6MjA4OTE2MDc2NX0.dHlnfYMJ4d9y8zdwSWC6bGqDCwwUy8F1QL8729BeTOQ";

        // Leer el hash antes de crear el cliente (supabase-js lo consume al iniciar)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const isRecoveryLink = hashParams.get('type') === 'recovery';
        const linkError = hashParams.get('error_description');

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const requestForm = document.getElementById('request-form');
        const updateForm = document.getElementById('update-form');
        const msg = document.getElementById('msg');

        function showMsg(text, ok) {
            msg.innerText = text;
            msg.className = (ok ? "text-primary" : "text-red-500") + " text-[10px] text-center mt-4";
        }

        function showUpdateForm() {
            requestForm.classList.add('hidden');
            updateForm.classList.remove('hidden');
            document.getElementById('subtitle').innerText = "Nueva Contraseña";
        }

        if (isRecoveryLink) showUpdateForm();
        if (linkError) showMsg("El link expiró o ya fue usado. Pedí uno nuevo.", false);

        supabaseClient.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') showUpdateForm();
        });

        requestForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = requestForm.querySelector('button');
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const redirectTo = window.location.origin + window.location.pathname;
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

            btn.disabled = false;
            if (error) {
                showMsg(error.message, false);
            } else {
                // Mensaje genérico: no revelar si el email está registrado
                showMsg("Si el email está registrado, te llegará un link en unos minutos. Revisá también la carpeta de spam.", true);
            }
        };

        updateForm.onsubmit = async (e) => {
            e.preventDefault();
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                showMsg("Las contraseñas no coinciden.", false);
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                showMsg("El link expiró o ya fue usado. Pedí uno nuevo.", false);
                return;
            }

            const btn = updateForm.querySelector('button');
            btn.disabled = true;
            const { error } = await supabaseClient.auth.updateUser({ password });
            btn.disabled = false;

            if (error) {
                showMsg(error.message, false);
            } else {
                showMsg("¡Contraseña actualizada! Redirigiendo al login...", true);
                await supabaseClient.auth.signOut();
                setTimeout(() => window.location.href = "login.html", 2000);
            }
        };
    </script>
</body>
</html>
