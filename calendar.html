<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Calendario DCEP</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#bfff00",
                        "background-dark": "#050505",
                        "card-dark": "#121212",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Lexend', sans-serif; background-color: #050505; }
        .glass-card {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-border {
            border: 1px solid rgba(191, 255, 0, 0.2);
            box-shadow: 0 0 15px rgba(191, 255, 0, 0.05);
        }
        .date-chip.active {
            background-color: #bfff00;
            color: #050505;
            box-shadow: 0 0 20px rgba(191, 255, 0, 0.3);
        }
    </style>
    <link rel="stylesheet" href="assets/cursor.css"/>
    <script src="assets/cursor.js" defer></script>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen flex flex-col font-display pb-20">

    <!-- Header -->
    <header class="p-6 pb-2 flex justify-between items-center sticky top-0 z-30 bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
        <a href="dashboard.html" id="back-link" class="text-primary/80 hover:text-primary transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h1 class="text-xl font-black text-primary tracking-tighter italic uppercase">Calendario</h1>
        <div id="admin-controls-toggle" class="hidden">
            <button id="add-shift-btn" class="text-primary hover:scale-110 transition-transform">
                <span class="material-symbols-outlined text-3xl">add_circle</span>
            </button>
        </div>
    </header>

    <main class="p-6 space-y-8 max-w-3xl mx-auto w-full">
        <!-- Credit Banner (solo atletas) -->
        <div id="credit-banner" class="hidden bg-card-dark rounded-3xl p-5 border border-primary/20 flex items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="size-12 rounded-2xl bg-primary/10 flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary">confirmation_number</span>
                </div>
                <div>
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-[0.2em]">Mis créditos</p>
                    <p id="credit-amount" class="text-2xl font-black italic text-white leading-tight">--</p>
                </div>
            </div>
            <p id="credit-expiry" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest text-right"></p>
        </div>

        <!-- Week Navigation -->
        <div class="space-y-4">
            <div class="flex items-center justify-between">
                <button id="prev-week" class="size-10 rounded-full bg-card-dark border border-white/5 flex items-center justify-center text-slate-400 hover:text-primary hover:border-primary/30 transition-all disabled:opacity-20 disabled:pointer-events-none">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <p id="week-label" class="text-xs font-black uppercase tracking-[0.2em] text-slate-400">--</p>
                <button id="next-week" class="size-10 rounded-full bg-card-dark border border-white/5 flex items-center justify-center text-slate-400 hover:text-primary hover:border-primary/30 transition-all">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar" id="week-selector">
                <!-- Days will be loaded here -->
            </div>
        </div>

        <div id="shifts-container" class="space-y-4">
            <!-- Shifts will be loaded here -->
            <div class="text-center py-20 opacity-20">
                <span class="material-symbols-outlined text-6xl mb-4">event_busy</span>
                <p class="text-sm font-bold uppercase tracking-widest">No hay turnos para este día</p>
            </div>
        </div>
    </main>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 z-50 bg-black/95 items-center justify-center p-6 hidden">
        <div class="bg-card-dark rounded-[2.5rem] p-8 w-full max-w-md border border-white/5 space-y-6">
            <h2 class="text-2xl font-black italic text-primary uppercase">Nuevo Turno</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] uppercase font-black text-slate-500 mb-2 block tracking-widest ml-1">Fecha</label>
                    <input type="date" id="new-shift-date" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-primary/50">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] uppercase font-black text-slate-500 mb-2 block tracking-widest ml-1">Inicio</label>
                        <input type="time" id="new-shift-start" value="16:00" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-primary/50">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-black text-slate-500 mb-2 block tracking-widest ml-1">Fin</label>
                        <input type="time" id="new-shift-end" value="17:30" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-primary/50">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] uppercase font-black text-slate-500 mb-2 block tracking-widest ml-1">Canchas (1 o 2)</label>
                        <input type="number" id="new-shift-court" value="1" min="1" max="2" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-primary/50" onchange="document.getElementById('new-shift-max').value = this.value * 4">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-black text-slate-500 mb-2 block tracking-widest ml-1">Cupos Totales</label>
                        <input type="number" id="new-shift-max" value="4" readonly class="w-full bg-black/30 text-slate-500 border border-white/5 rounded-xl px-4 py-3 outline-none cursor-not-allowed">
                    </div>
                </div>
                <div class="pt-4 space-y-3">
                    <button id="save-new-shift" class="w-full bg-primary text-black font-black py-4 rounded-2xl uppercase tracking-widest text-xs">Crear Turno</button>
                    <button id="close-modal" class="w-full text-slate-500 font-bold uppercase tracking-widest text-[10px]">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Player Modal -->
    <div id="add-player-modal" class="fixed inset-0 z-50 bg-black/95 items-center justify-center p-6 hidden">
        <div class="bg-card-dark rounded-[2.5rem] p-8 w-full max-w-sm border border-white/5 space-y-6">
            <h2 class="text-xl font-black italic text-primary uppercase">Asignar Jugador</h2>
            <div class="space-y-4">
                <select id="athlete-assign-select" class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-primary/50">
                    <option value="">Seleccionar Atleta...</option>
                </select>
                <div class="pt-2 space-y-3">
                    <button id="save-player-assign" class="w-full bg-primary text-black font-black py-4 rounded-2xl uppercase tracking-widest text-xs">Anotar al Turno</button>
                    <button id="close-player-modal" class="w-full text-slate-500 font-bold uppercase tracking-widest text-[10px]">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://nfmbklhhrrnrakndkcch.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mbWJrbGhocnJucmFrbmRrY2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1ODQ3NjUsImV4cCI6MjA4OTE2MDc2NX0.dHlnfYMJ4d9y8zdwSWC6bGqDCwwUy8F1QL8729BeTOQ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isAdmin = false;
        let cancelHours = 12;
        let credits = { unlimited: false, available: 0, next_expiry: null };

        const today = new Date();
        today.setHours(0,0,0,0);
        let selectedDate = new Date(today);
        const currentWeekStart = getWeekStart(today);
        let weekStart = new Date(currentWeekStart);

        function getWeekStart(date) {
            const d = new Date(date);
            const offset = (d.getDay() + 6) % 7; // Lunes = 0
            d.setDate(d.getDate() - offset);
            d.setHours(0,0,0,0);
            return d;
        }

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "login.html"; return; }
            currentUser = session.user;

            const { data: profile } = await supabaseClient.from('profiles').select('is_admin').eq('id', currentUser.id).single();
            isAdmin = profile?.is_admin || false;

            const { data: settings } = await supabaseClient.from('app_settings').select('cancel_hours').eq('id', 1).maybeSingle();
            if (settings) cancelHours = settings.cancel_hours;

            if (isAdmin) {
                document.getElementById('admin-controls-toggle').style.display = 'block';
                document.getElementById('admin-controls-toggle').classList.remove('hidden');
                await fetchAllAthletes();
            } else {
                // If athlete, change back link to profile
                document.getElementById('back-link').href = 'perfil.html';
                document.getElementById('credit-banner').classList.remove('hidden');
                await loadCredits();
            }

            renderWeek();
            loadShifts();
        }

        async function loadCredits() {
            const { data } = await supabaseClient
                .from('credit_balances')
                .select('unlimited, available, next_expiry')
                .eq('profile_id', currentUser.id)
                .maybeSingle();
            if (data) credits = data;

            const amountEl = document.getElementById('credit-amount');
            const expiryEl = document.getElementById('credit-expiry');
            if (credits.unlimited) {
                amountEl.innerText = 'Cupo libre';
                expiryEl.innerText = '';
            } else {
                amountEl.innerText = `${credits.available} ${credits.available === 1 ? 'turno' : 'turnos'}`;
                amountEl.classList.toggle('text-red-500', credits.available === 0);
                expiryEl.innerText = credits.next_expiry
                    ? `Vence ${new Date(credits.next_expiry).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' })}`
                    : 'Consultá con el coach para recargar';
            }
        }

        function renderWeek() {
            const container = document.getElementById('week-selector');
            container.innerHTML = '';

            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            const fmt = { day: 'numeric', month: 'short' };
            document.getElementById('week-label').innerText =
                `${weekStart.toLocaleDateString('es-AR', fmt)} — ${weekEnd.toLocaleDateString('es-AR', fmt)}`;

            // Los atletas no navegan a semanas pasadas
            document.getElementById('prev-week').disabled = !isAdmin && weekStart <= currentWeekStart;

            for (let i = 0; i < 7; i++) {
                const day = new Date(weekStart);
                day.setDate(weekStart.getDate() + i);

                const isActive = day.getTime() === selectedDate.getTime();
                const isToday = day.getTime() === today.getTime();
                const isPastDay = day < today;
                const dayName = isToday ? 'HOY' : day.toLocaleDateString('es-AR', { weekday: 'short' }).replace('.', '').toUpperCase();

                const dayEl = document.createElement('button');
                dayEl.className = `date-chip flex flex-col items-center flex-1 min-w-[48px] py-4 rounded-2xl transition-all ${isActive ? 'active' : 'bg-card-dark border border-white/5 hover:border-primary/30'} ${isPastDay && !isActive ? 'opacity-30' : ''}`;
                dayEl.onclick = () => {
                    selectedDate = day;
                    renderWeek();
                    loadShifts();
                };
                dayEl.innerHTML = `
                    <span class="text-[9px] font-black tracking-widest mb-1">${dayName}</span>
                    <span class="text-lg font-black">${day.getDate()}</span>
                `;
                container.appendChild(dayEl);
            }
        }

        function changeWeek(delta) {
            weekStart.setDate(weekStart.getDate() + delta * 7);
            // Al cambiar de semana se selecciona el lunes, o hoy si es la semana actual
            selectedDate = weekStart.getTime() === currentWeekStart.getTime() ? new Date(today) : new Date(weekStart);
            renderWeek();
            loadShifts();
        }
        document.getElementById('prev-week').onclick = () => changeWeek(-1);
        document.getElementById('next-week').onclick = () => changeWeek(1);

        async function loadShifts() {
            const container = document.getElementById('shifts-container');

            const startOfDay = new Date(selectedDate);
            const endOfDay = new Date(selectedDate);
            endOfDay.setHours(23,59,59,999);

            const { data: shifts, error } = await supabaseClient
                .from('shifts')
                .select('*, bookings(profile_id)')
                .gte('start_time', startOfDay.toISOString())
                .lte('start_time', endOfDay.toISOString())
                .order('start_time');

            if (error) return console.error(error);

            if (!shifts || shifts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 opacity-20">
                        <span class="material-symbols-outlined text-6xl mb-4">event_busy</span>
                        <p class="text-sm font-bold uppercase tracking-widest">No hay turnos para este día</p>
                    </div>
                `;
                return;
            }

            const now = Date.now();
            const hasCredits = credits.unlimited || credits.available > 0;

            container.innerHTML = shifts.map(shift => {
                const bookedCount = shift.bookings?.length || 0;
                const isFull = bookedCount >= shift.max_players;
                const userBooked = shift.bookings?.some(b => b.profile_id === currentUser.id);
                const shiftStart = new Date(shift.start_time).getTime();
                const isPast = shiftStart <= now;
                const canCancel = shiftStart - now > cancelHours * 3600 * 1000;

                const startTime = new Date(shift.start_time).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                const endTime = new Date(shift.end_time).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

                // Estado del botón del atleta
                let btn;
                if (userBooked && isPast) {
                    btn = { label: 'Asististe', cls: 'bg-primary/10 text-primary border border-primary/20', disabled: true };
                } else if (userBooked && canCancel) {
                    btn = { label: 'Bajarme', cls: 'bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-500/20', disabled: false };
                } else if (userBooked) {
                    btn = { label: 'Anotado', cls: 'bg-primary/10 text-primary border border-primary/20', disabled: true, title: `Solo podés bajarte hasta ${cancelHours} h antes. Consultá con el coach.` };
                } else if (isPast) {
                    btn = { label: 'Finalizado', cls: 'bg-slate-800 text-slate-500', disabled: true };
                } else if (isFull) {
                    btn = { label: 'Completo', cls: 'bg-slate-800 text-slate-500', disabled: true };
                } else if (!hasCredits) {
                    btn = { label: 'Sin créditos', cls: 'bg-slate-800 text-slate-500', disabled: true, title: 'Consultá con el coach para recargar.' };
                } else {
                    btn = { label: 'Anotarme', cls: 'bg-primary text-black shadow-lg shadow-primary/20 hover:bg-[#d4ff00]', disabled: false };
                }

                return `
                    <div class="bg-card-dark rounded-3xl p-6 border border-white/5 flex items-center justify-between shadow-xl relative overflow-hidden ${isPast ? 'opacity-50' : ''}">
                        ${userBooked ? '<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>' : ''}
                        <div class="flex flex-col gap-1">
                            <p class="text-[9px] font-black text-slate-500 uppercase tracking-[0.2em] mb-1">${shift.court_number === 2 ? '2 CANCHAS (1 & 2)' : '1 CANCHA'}</p>
                            <h3 class="text-xl font-black italic text-white leading-none">${startTime} — ${endTime}</h3>
                            <div class="flex items-center gap-2 mt-2">
                                <span class="material-symbols-outlined text-sm ${isFull ? 'text-red-500' : 'text-primary'}">groups</span>
                                <span class="text-[10px] font-bold uppercase tracking-widest ${isFull ? 'text-red-500' : 'text-slate-400'}">
                                    ${bookedCount} / ${shift.max_players} JUGADORES
                                </span>
                            </div>
                            ${isAdmin && bookedCount > 0 ? `
                                <div class="flex flex-wrap gap-2 mt-3">
                                    ${shift.bookings.map(b => `
                                        <span class="flex items-center gap-1 bg-white/5 border border-white/10 rounded-full pl-3 pr-1 py-1 text-[10px] font-bold text-slate-300">
                                            ${athleteName(b.profile_id)}
                                            <button onclick="removePlayer('${shift.id}', '${b.profile_id}')" class="size-5 rounded-full flex items-center justify-center text-slate-500 hover:text-red-500 hover:bg-red-500/10 transition-colors" title="Sacar del turno">
                                                <span class="material-symbols-outlined text-sm">close</span>
                                            </button>
                                        </span>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>

                        ${isAdmin ? `
                            <div class="flex gap-4">
                                <button onclick="openAddPlayerModal('${shift.id}')" class="text-slate-500 hover:text-primary transition-colors" title="Agregar Jugador">
                                    <span class="material-symbols-outlined">person_add</span>
                                </button>
                                <button onclick="deleteShift('${shift.id}')" class="text-slate-700 hover:text-red-500 transition-colors" title="Eliminar Turno">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </div>
                        ` : `
                            <button onclick="handleBooking('${shift.id}', ${userBooked})"
                                class="px-6 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${btn.cls} ${btn.disabled ? 'cursor-not-allowed' : ''}"
                                ${btn.title ? `title="${btn.title}"` : ''}
                                ${btn.disabled ? 'disabled' : ''}>
                                ${btn.label}
                            </button>
                        `}
                    </div>
                `;
            }).join('');
        }

        window.handleBooking = async (shiftId, userBooked) => {
            if (userBooked) {
                if (!confirm('¿Bajarte de este turno? Se te devuelve el crédito.')) return;
                const { error } = await supabaseClient.from('bookings').delete().match({ shift_id: shiftId, profile_id: currentUser.id });
                if (error) alert(error.message);
            } else {
                const { error } = await supabaseClient.from('bookings').insert([{ shift_id: shiftId, profile_id: currentUser.id }]);
                if (error) alert(error.code === '23505' ? 'Ya estás anotado en este turno.' : error.message);
            }
            await loadCredits();
            loadShifts();
        };

        window.removePlayer = async (shiftId, profileId) => {
            if (!confirm(`¿Sacar a ${athleteName(profileId)} del turno? Si el turno no empezó, se le devuelve el crédito.`)) return;
            const { error } = await supabaseClient.from('bookings').delete().match({ shift_id: shiftId, profile_id: profileId });
            if (error) alert(error.message);
            loadShifts();
        };

        window.deleteShift = async (id) => {
            if(!confirm('¿Borrar este turno? A los anotados se les devuelve el crédito.')) return;
            const { error } = await supabaseClient.from('shifts').delete().eq('id', id);
            if (error) alert(error.message);
            loadShifts();
        };

        // Modal Logic
        document.getElementById('add-shift-btn').onclick = () => {
            document.getElementById('new-shift-date').value = selectedDate.toISOString().split('T')[0];
            document.getElementById('admin-modal').classList.replace('hidden', 'flex');
        };
        document.getElementById('close-modal').onclick = () => document.getElementById('admin-modal').classList.replace('flex', 'hidden');

        document.getElementById('save-new-shift').onclick = async () => {
            const dateStr = document.getElementById('new-shift-date').value;
            const startStr = document.getElementById('new-shift-start').value;
            const endStr = document.getElementById('new-shift-end').value;
            const max = document.getElementById('new-shift-max').value;
            const court = document.getElementById('new-shift-court').value;

            const start = new Date(`${dateStr}T${startStr}:00`);
            const end = new Date(`${dateStr}T${endStr}:00`);

            const { error } = await supabaseClient.from('shifts').insert([{
                start_time: start.toISOString(),
                end_time: end.toISOString(),
                max_players: parseInt(max),
                court_number: parseInt(court)
            }]);

            if (error) alert(error.message);
            else {
                document.getElementById('admin-modal').classList.replace('flex', 'hidden');
                loadShifts();
            }
        };

        let allAthletes = [];
        function athleteName(profileId) {
            const a = allAthletes.find(x => x.profile_id === profileId);
            return a ? `${a.name} ${a.last_name || ''}`.trim() : 'Atleta';
        }
        async function fetchAllAthletes() {
            const { data: athletes } = await supabaseClient.from('athletes').select('profile_id, name, last_name').order('name');
            allAthletes = athletes || [];
            const select = document.getElementById('athlete-assign-select');
            allAthletes.forEach(a => {
                if(a.profile_id) {
                    const opt = document.createElement('option');
                    opt.value = a.profile_id;
                    opt.innerText = `${a.name} ${a.last_name || ''}`;
                    opt.className = "bg-[#121212]";
                    select.appendChild(opt);
                }
            });
        }

        let currentShiftIdToAssign = null;
        window.openAddPlayerModal = (shiftId) => {
            currentShiftIdToAssign = shiftId;
            document.getElementById('add-player-modal').classList.replace('hidden', 'flex');
        };
        document.getElementById('close-player-modal').onclick = () => document.getElementById('add-player-modal').classList.replace('flex', 'hidden');

        document.getElementById('save-player-assign').onclick = async () => {
            const profileId = document.getElementById('athlete-assign-select').value;
            if(!profileId) return alert("Selecciona un atleta");

            const { error } = await supabaseClient.from('bookings').insert([{ shift_id: currentShiftIdToAssign, profile_id: profileId }]);
            if (error) {
                if(error.code === '23505') alert('El jugador ya está en este turno.');
                else alert(error.message);
            } else {
                document.getElementById('add-player-modal').classList.replace('flex', 'hidden');
                loadShifts();
            }
        };

        init();
    </script>
</body>
</html>
